<meta name="apple-mobile-web-app-title" content="Deptos">
<title>Deptos CDMX en mapa</title>

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#17181b;--mut:#62666e;--line:#e3e5e9;--card:#f6f7f9;--pin:#e4007c;--metro:#f07c00;--mb:#d5172b;--warn:#b45309;--ok:#0f7a43}
@media(prefers-color-scheme:dark){:root{--bg:#121316;--ink:#eef0f3;--mut:#9aa0aa;--line:#2a2d33;--card:#1b1d21}}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:16px/1.45 Archivo,system-ui,-apple-system,sans-serif}
body{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
header{padding:10px 16px 0;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:22px;line-height:1.1;margin:0;font-weight:800}
.count{font-size:13px;color:var(--mut);white-space:nowrap}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;flex:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:600 14px Archivo,system-ui,sans-serif}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#map{flex:1 1 auto;min-height:240px;z-index:0}
.leaflet-container{font:14px Archivo,system-ui,sans-serif;background:#e9e7e3}
.pinbox{background:none;border:0}
.pp{transform:translate(-50%,-100%);display:inline-block;background:var(--pin);color:#fff;font-weight:800;font-size:12px;padding:3px 7px;border-radius:12px;border:2px solid #fff;box-shadow:0 2px 6px #0004;white-space:nowrap;position:relative}
.pp:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--pin);border-bottom:0}
.pp.w{background:var(--warn)}.pp.w:after{border-top-color:var(--warn)}
.pp.on{background:var(--ink);transform:translate(-50%,-100%) scale(1.2);z-index:9}.pp.on:after{border-top-color:var(--ink)}.pp[style]:after{border-top-color:#1a73e8}
.mapbtns{position:absolute;right:10px;bottom:10px;z-index:500;display:grid;gap:6px}
.mb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:800 18px Archivo,sans-serif;box-shadow:0 2px 8px #0003}
.wrap{position:relative;flex:1 1 auto;display:flex}
.sheet{flex:none;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);background:var(--bg)}
.rail{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:12px 16px;scroll-padding-inline:16px;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.card{flex:0 0 min(86vw,360px);scroll-snap-align:start;background:var(--card);border:2px solid transparent;border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.card.on{border-color:var(--pin)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.price{font-size:24px;font-weight:800;white-space:nowrap}
.ppm{font-size:13px;color:var(--mut);white-space:nowrap}
.addr{font-weight:600;line-height:1.25}
.col{color:var(--mut);font-size:14px}
.facts{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:13px;padding:2px 8px;border-radius:8px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.tag.good{color:var(--ok);border-color:currentColor}.tag.warn{color:var(--warn);border-color:currentColor}.tag.pink{color:var(--pin);border-color:currentColor}
.transit{font-size:14px;display:grid;gap:1px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.note{font-size:14px;color:var(--mut);margin:0}
details.note summary{cursor:pointer;color:var(--ink);font-weight:600}
.btns{display:flex;gap:8px;margin-top:4px}
.btn{flex:1 1 auto;min-height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;font:600 15px Archivo,sans-serif;text-decoration:none;padding:0 10px;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.btn.main{background:var(--pin);border-color:var(--pin);color:#fff}
.fav{flex:0 0 44px;font-size:20px;padding:0}
.chip:focus-visible,.btn:focus-visible,.mb:focus-visible{outline:3px solid var(--pin);outline-offset:2px}
@media(min-width:900px){body{display:grid;grid-template-columns:1fr 400px;grid-template-rows:auto auto 1fr}header,.chips{grid-column:1/3}.wrap{grid-row:3}.sheet{grid-row:3;overflow-y:auto;border-top:0;border-left:1px solid var(--line)}.rail{flex-direction:column;overflow:visible}.card{flex:none}}
</style>
</head>

const drawChips=()=>{chips.innerHTML=F.map(f=>`<button class="chip" data-f="${f[0]}" aria-pressed="${filt===f[0]}">${esc(f[1])}</button>`).join('')+SORT.map(s=>`<button class="chip" data-s="${s[0]}" aria-pressed="${sort===s[0]}">↕ ${esc(s[1])}</button>`).join('')+`<button class="chip" data-st="1" aria-pressed="${showSt}">Estaciones</button>`};
let io=null;
const render=()=>{drawChips();const a=list();count.textContent=`${a.length} de ${D.length}`;if(a.length&&!a.some(d=>d.id===sel))sel=a[0].id;rail.innerHTML=a.length?a.map(card).join(''):'<p class="note">Ningún departamento cumple este filtro.</p>';drawPins();if(io){io.disconnect();rail.querySelectorAll('.card').forEach(c=>io.observe(c))}};
const pick=(id,scroll,pan)=>{sel=id;document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.dataset.id===id));drawPins();const d=D.find(x=>x.id===id);if(pan)map.panTo([d.lat,d.lon]);if(scroll){const c=document.getElementById('c-'+id);if(c)c.scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'})}};
const fitAll=()=>{const a=list();if(a.length)map.fitBounds(L.latLngBounds(a.map(d=>[d.lat,d.lon]).concat([OFF])),{padding:[40,40]})};
chips.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.f)filt=b.dataset.f;if(b.dataset.s)sort=b.dataset.s;if(b.dataset.st){showSt=!showSt;showSt?stLayer.addTo(map):map.removeLayer(stLayer)}render();if(b.dataset.f)fitAll()});
rail.addEventListener('click',e=>{const f=e.target.closest('[data-fav]');if(f){const id=f.dataset.fav;favs=favs.includes(id)?favs.filter(x=>x!==id):[...favs,id];saveFav();f.textContent=favs.includes(id)?'★':'☆';return}const c=e.target.closest('.card');if(c&&!e.target.closest('a,summary'))pick(c.dataset.id,false,true)});
try{io=new IntersectionObserver(es=>{if(innerWidth>=900)return;es.forEach(en=>{if(en.isIntersecting&&en.intersectionRatio>.7&&sel!==en.target.dataset.id)pick(en.target.dataset.id,false,true)})},{root:rail,threshold:[.7]})}catch(e){}
document.getElementById('fit').onclick=fitAll;
let me=null;document.getElementById('loc').onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];if(me)map.removeLayer(me);me=L.circleMarker(ll,{radius:8,color:'#fff',weight:3,fillColor:'#1a73e8',fillOpacity:1}).addTo(map);map.setView(ll,15)},()=>{},{enableHighAccuracy:true,timeout:8000})};
map.on('zoomend',drawPins);sel=list()[0].id;render();setTimeout(()=>{map.invalidateSize();fitAll()},200);
}
</script>
</body>
</html>
